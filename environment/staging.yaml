# Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: abhinav.singh@mongodb.com

env:
  NODE_ENV: staging

## Single Pod Containers
envSecrets: {}
  

## should be used in case of multiple sidecar containers
sidecarContainers:
  - name: backend
    image: 275662791714.dkr.ecr.us-east-1.amazonaws.com/kanopy-session-backend:latest
    env:
      # MongoDB connection (from Kubernetes secret)
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: retail-instant-loyalty
            key: MONGODB_URI

      - name: DATABASE_NAME
        valueFrom:
          secretKeyRef:
            name: retail-instant-loyalty
            key: DATABASE_NAME

      - name: PORT
        valueFrom:
          secretKeyRef:
            name: retail-instant-loyalty
            key: PORT

