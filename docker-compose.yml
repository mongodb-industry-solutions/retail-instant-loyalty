services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: loyalty-backend
    env_file:
      - backend/.env
    environment:
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: loyalty-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8080:8080"
    depends_on:
      - backend
